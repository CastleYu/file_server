[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AbyssFS"
version = "1.0.0"
description = "A versatile multi-protocol file server manager (FTP/FTPS/SFTP/SMB/WebDAV/NFS)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "CastleYu", email = "muziyuc@gmail.com"}
]
dependencies = [
    "PyQt6>=6.4.0",
    "pyftpdlib>=1.5.7",
    "paramiko>=3.0.0",
    "cryptography>=39.0.0",
    "pyOpenSSL>=26.3.0; python_version>='3.9'",
    "impacket>=0.11.0",
    "wsgidav>=4.3.0",
    "cheroot>=10.0.0",
]

[project.scripts]
fs-manager = "abyssfs.ui.main_window:main"
abyssfs-service = "abyssfs.service.cli:main"

[tool.setuptools]
packages = [
    "abyssfs",
    "abyssfs.ui",
    "abyssfs.control",
    "abyssfs.model",
    "abyssfs.protocol",
    "abyssfs.fs",
    "abyssfs.plugins",
    "abyssfs.service",
]
