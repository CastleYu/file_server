name: Build and release with Nuitka

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # 自动缓存 pip 依赖

      # 缓存 Nuitka 的编译产物和外部工具 (如 Dependency Walker)
      - name: Cache Nuitka dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install nuitka wheel
        shell: pwsh

      - name: Verify ftp.ico
        run: |
          if (-Not (Test-Path -Path ftp.ico)) { 
            Write-Host "Warning: ftp.ico not found in repository root." 
          } else { 
            Write-Host "ftp.ico found." 
          }
        shell: pwsh

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --assume-yes-for-downloads `
            --onefile `
            --lto=yes `
            --enable-plugins=pyqt6 `
            --include-qt-plugins=styles,platforms `
            --windows-console-mode=disable `
            --windows-icon-from-ico=ftp.ico `
            --include-package=pyftpdlib `
            --include-package=paramiko `
            --include-package=asyncore `
            --include-package=asynchat `
            --output-dir=build `
            --output-filename=FS.exe `
            ftp_app.py
        shell: pwsh

      - name: Collect built executable
        run: |
          # 寻找生成的 exe（通常在 build 目录下的 .dist 文件夹中）
          $exe = Get-ChildItem -Path build -Filter 'FS.exe' -Recurse | Select-Object -First 1
          if (-Not $exe) {
            Write-Error "No executable found in build output."
            exit 1
          }
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item $exe.FullName -Destination artifact\FS.exe -Force
          Write-Host "Packaged: $($exe.FullName) -> artifact\FS.exe"
        shell: pwsh

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifact/*.exe
          allowUpdates: true # 如果发布已存在，允许更新附件
