name: Build and Release (Nuitka)

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt', 'ftp_app.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka wheel
        shell: pwsh

      - name: Check ftp.ico
        run: |
          if (-Not (Test-Path -Path ftp.ico)) {
            Write-Host "Warning: ftp.ico not found in repository root."
          } else {
            Write-Host "ftp.ico found."
          }
        shell: pwsh

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --assume-yes-for-downloads `
            --onefile `
            --lto=yes `
            --enable-plugins=pyqt6 `
            --include-qt-plugins=styles,platforms `
            --windows-console-mode=disable `
            --windows-icon-from-ico=ftp.ico `
            --include-package=pyftpdlib `
            --include-package=paramiko `
            --include-package=asyncore `
            --include-package=asynchat `
            --output-dir=build `
            --output-filename=FS.exe `
            ftp_app.py
        shell: pwsh

      - name: Collect executable
        run: |
          $exe = Get-ChildItem -Path build -Filter 'FS.exe' -Recurse | Select-Object -First 1
          if (-Not $exe) {
            Write-Error "No executable found in build output."
            exit 1
          }
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item $exe.FullName -Destination artifact\FS.exe -Force
          Write-Host "Packaged: $($exe.FullName) -> artifact\FS.exe"
        shell: pwsh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FS-windows
          path: artifact/FS.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifact/*.exe
          allowUpdates: true